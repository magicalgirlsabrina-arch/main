- ClawBoxes:
    - ClawBox 1:
        href: http://{{HOMEPAGE_VAR_CLAWBOX_1_HOST}}:18789
        description: OpenClaw gateway
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_CLAWBOX_1_HOST}}:18789/api/diagnostics/summary
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_CLAWBOX_1_TOKEN}}
          mappings:
            - field: model
              label: Model
            - field: tokens_per_sec
              label: tok/s
              format: float
            - field: active_sessions
              label: Sessions

