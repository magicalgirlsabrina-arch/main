# Familiar tiles route through the Coven Mail Bridge (`/api/familiar/{name}`)
# so they get a consistent shape and survive OpenClaw API changes.
# The themed name is the title; description = technical subtitle (monospaced,
# dimmed lavender — see custom.css → .service-description).

- Sabrina's Locker:
    - Coven Mail:
        href: http://localhost:18793/
        description: coven-mail-bridge · spellbook UI
        icon: mdi-mail-#E879A6
        widget:
          type: customapi
          url: http://coven-mail:18793/api/unread-count
          mappings:
            - field: unread
              label: Unread
              format: number
            - field: total
              label: Total
              format: number

    - Coven Status:
        description: live peer-ping · all 4 familiars
        icon: mdi-heart-pulse-#E879A6
        href: http://localhost:18793/#debug
        widget:
          type: customapi
          url: http://coven-mail:18793/api/peer-ping
          mappings:
            - field: salem.ok
              label: Salem
              format: text
            - field: hilda.ok
              label: Hilda
              format: text
            - field: zelda.ok
              label: Zelda
              format: text
            - field: harvey.ok
              label: Harvey
              format: text

    - Surveillance:
        description: activity · cron · watchdog · upgrades
        icon: mdi-radar-#9F8FE3
        href: http://localhost:18793/#surveillance
        widget:
          type: customapi
          url: http://coven-mail:18793/api/activity?limit=1
          mappings:
            - field: events.0.kind
              label: Latest event
              format: text

    - Howling Hat:
        href: http://localhost:9093
        description: alertmanager · :9093
        icon: mdi-bell-ring-#FF7E73

- Coven:
