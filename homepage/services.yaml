# Familiar tiles route through the Coven Mail Bridge (`/api/familiar/{name}`)
# so they get a consistent shape and survive OpenClaw API changes.
# Tile titles use the v4 Sabrina palette: #FF1493 hot pink, #B19CD9
# lavender, #FFD700 gold, #5FFFE6 mint, #FF6B6B ember.
#
# All hrefs use Spellman Manor's IP (not `localhost`) so tapping a tile
# on your iPhone over Tailscale opens the actual app — not a 404 on
# the phone's own port. Homepage substitutes the value from .env at
# render time.

- Sabrina's Locker:
    - Coven Mail:
        href: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:18793/
        description: coven-mail-bridge · spellbook UI
        icon: mdi-mail-#FF1493
        widget:
          type: customapi
          url: http://coven-mail:18793/api/unread-count
          mappings:
            - field: unread
              label: Unread
              format: number
            - field: total
              label: Total
              format: number

    - Coven Status:
        description: live peer-ping · all 4 familiars
        icon: mdi-heart-pulse-#FF1493
        href: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:18793/#debug
        widget:
          type: customapi
          url: http://coven-mail:18793/api/peer-ping
          mappings:
            - field: salem.ok
              label: Salem
              format: text
            - field: hilda.ok
              label: Hilda
              format: text
            - field: zelda.ok
              label: Zelda
              format: text
            - field: harvey.ok
              label: Harvey
              format: text

    - Surveillance:
        description: activity · cron · watchdog · upgrades
        icon: mdi-radar-#B19CD9
        href: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:18793/#surveillance
        widget:
          type: customapi
          url: http://coven-mail:18793/api/activity?limit=1
          mappings:
            - field: events.0.kind
              label: Latest event
              format: text

    - Howling Hat:
        href: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:9093
        description: alertmanager · :9093
        icon: mdi-bell-ring-#FF6B6B

