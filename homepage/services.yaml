# Each tile shows a themed name (big, fancy font) and a technical subtitle
# (small monospace, dimmed lavender). The subtitle lives in `description:`
# and is styled by .service-description in custom.css.

- Sabrina's Console:
    - Coven Mail:
        href: http://localhost:18793/
        description: coven-mail-bridge · :18793 · spellbook ui
        icon: mdi-mail-#ffd700
        widget:
          type: customapi
          url: http://coven-mail:18793/api/unread-count
          mappings:
            - field: unread
              label: Unread
              format: number
            - field: total
              label: Total messages
              format: number

    - Coven Status:
        description: bridge /api/peer-ping · all 4 familiars
        icon: mdi-heart-pulse-#ff1493
        href: http://localhost:18793/#debug
        widget:
          type: customapi
          url: http://coven-mail:18793/api/peer-ping
          mappings:
            - field: salem.ok
              label: Salem
              format: text
            - field: hilda.ok
              label: Hilda
              format: text
            - field: zelda.ok
              label: Zelda
              format: text
            - field: harvey.ok
              label: Harvey
              format: text

    - Howling Hat:
        href: http://localhost:9093
        description: alertmanager · :9093
        icon: mdi-bell-ring-#ff6ec7

- The Coven:
    - Salem:
        href: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:{{HOMEPAGE_VAR_SALEM_GATEWAY_PORT}}
        description: openclaw familiar · spellman-manor:18789
        icon: mdi-cat-#ffd700
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:{{HOMEPAGE_VAR_SALEM_GATEWAY_PORT}}/api/diagnostics/summary
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_SALEM_GATEWAY_TOKEN}}
