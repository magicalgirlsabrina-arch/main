# Layout matches the actual topology:
#   - 3 hosts (Mac mini, Mac Pro, MacBook Pro) — "The Households"
#   - 4 familiars (salem on mini :18789, hilda on mini :18790, zelda on macbook,
#     harvey on mac pro) — "The Coven"
#   - Coven Mail Bridge + Spellbook UI — "Sabrina's Console"

- Sabrina's Console:
    - Coven Mail:
        href: http://localhost:18793/
        description: 💌 Spellbook · cast history · send mail
        icon: mdi-mail-#ffd700
        widget:
          type: customapi
          url: http://coven-mail:18793/api/unread-count
          mappings:
            - field: unread
              label: Unread
              format: number
            - field: total
              label: Total messages
              format: number

    - Coven Status:
        description: 🩺 Live peer-ping across all 4 familiars
        icon: mdi-heart-pulse-#ff1493
        href: http://localhost:18793/#debug
        widget:
          type: customapi
          url: http://coven-mail:18793/api/peer-ping
          mappings:
            - field: salem.ok
              label: Salem
              format: text
            - field: hilda.ok
              label: Hilda
              format: text
            - field: zelda.ok
              label: Zelda
              format: text
            - field: harvey.ok
              label: Harvey
              format: text

    - Howling Hat:
        href: http://localhost:9093
        description: 🔔 Active alerts (Alertmanager)
        icon: mdi-bell-ring-#ff6ec7

- The Coven:
    - Salem:
        href: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:{{HOMEPAGE_VAR_SALEM_GATEWAY_PORT}}
        description: 🐈‍⬛ World domination from Spellman Manor
        icon: mdi-cat-#ffd700
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:{{HOMEPAGE_VAR_SALEM_GATEWAY_PORT}}/api/diagnostics/summary
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_SALEM_GATEWAY_TOKEN}}
          mappings:
            - field: model
              label: Channelling
            - field: tokens_per_sec
              label: tok/s
              format: float
            - field: active_sessions
              label: Spells
              format: number

    - Hilda:
        href: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:{{HOMEPAGE_VAR_HILDA_GATEWAY_PORT}}
        description: ☕ Chaos energy aunt (also on the mini)
        icon: mdi-tea-outline-#ff6ec7
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_SPELLMAN_MANOR_IP}}:{{HOMEPAGE_VAR_HILDA_GATEWAY_PORT}}/api/diagnostics/summary
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_HILDA_GATEWAY_TOKEN}}
          mappings:
            - field: model
              label: Channelling
            - field: tokens_per_sec
              label: tok/s
              format: float
            - field: active_sessions
              label: Spells
              format: number

    - Zelda:
        href: http://{{HOMEPAGE_VAR_ZELDAS_STUDY_IP}}:{{HOMEPAGE_VAR_ZELDA_GATEWAY_PORT}}
        description: 📖 Precise scholarly aunt (on the MacBook)
        icon: mdi-book-open-page-variant-#b19cd9
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_ZELDAS_STUDY_IP}}:{{HOMEPAGE_VAR_ZELDA_GATEWAY_PORT}}/api/diagnostics/summary
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_ZELDA_GATEWAY_TOKEN}}
          mappings:
            - field: model
              label: Channelling
            - field: tokens_per_sec
              label: tok/s
              format: float
            - field: active_sessions
              label: Spells
              format: number

    - Harvey:
        href: http://{{HOMEPAGE_VAR_HARVEYS_WORKSHOP_IP}}:{{HOMEPAGE_VAR_HARVEY_GATEWAY_PORT}}
        description: 🛠 Steady mortal boyfriend (on the Mac Pro)
        icon: mdi-tools-#7ec4ff
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_HARVEYS_WORKSHOP_IP}}:{{HOMEPAGE_VAR_HARVEY_GATEWAY_PORT}}/api/diagnostics/summary
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_HARVEY_GATEWAY_TOKEN}}
          mappings:
            - field: model
              label: Channelling
            - field: tokens_per_sec
              label: tok/s
              format: float
            - field: active_sessions
              label: Spells
              format: number

- The Households:
    - Spellman Manor:
        description: 🏠 Mac mini · runs Salem + Hilda + the Mailbox
        icon: mdi-home-heart-#ff6ec7
        href: http://localhost:8090

    - Harvey's Workshop:
        description: 🔱 Mac Pro · runs Harvey
        icon: mdi-shield-crown-#7ec4ff

    - Zelda's Study:
        description: 📚 MacBook Pro · runs Zelda
        icon: mdi-laptop-#b19cd9

- The Other Realm:
    - Vital Signs:
        href: http://localhost:8090
        description: 💗 Per-host CPU / RAM / disk
        icon: mdi-heart-pulse-#ff1493

    - The Scrying Glass:
        href: http://localhost:3001
        description: 🔮 Cast Log + Coven Atlas (Grafana)
        icon: grafana.png

    - The Magic Mirror:
        href: http://localhost:8080
        description: 🪞 Kiosk view for the Android TV
        icon: mdi-television-shimmer-#b19cd9

    - The Spellbook:
        href: http://localhost:18793/
        description: 📜 Full mail archive + console
        icon: mdi-book-open-blank-variant-#ffd700
