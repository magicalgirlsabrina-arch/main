# Each ClawBot gets a tile with a live OpenClaw status widget.
# Witchy descriptions match each Spellman family member's vibe.

- The Coven:
    - Hilda:
        href: http://{{HOMEPAGE_VAR_HILDA_HOST}}:18789
        description: ☕ Chaos energy aunt
        icon: mdi-tea-outline-#ff6ec7
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_HILDA_HOST}}:18789/api/diagnostics/summary
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_HILDA_TOKEN}}
          mappings:
            - field: model
              label: Channelling
            - field: tokens_per_sec
              label: tok/s
              format: float
            - field: active_sessions
              label: Spells
              format: number

