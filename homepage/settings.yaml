title: Spellman Manor
favicon: https://twemoji.maxcdn.com/v/latest/72x72/1f319.png

# Westbridge Dusk by default. Light mode = Westbridge Dawn (see custom.css).
theme: dark
color: slate
cardBlur: xl

layout:
  Sabrina's Locker:
    style: column
    icon: mdi-star-four-points
  Coven:
    style: column
    icon: mdi-cat
  Households:
    style: column
    icon: mdi-home-group
  Other Realm:
    style: column
    icon: mdi-eye-outline

headerStyle: clean
hideVersion: true
useEqualHeights: true
fiveColumns: false
disableCollapse: false

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  hideVisitURL: true
