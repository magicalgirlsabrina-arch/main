title: The Discovery of Magic
favicon: https://twemoji.maxcdn.com/v/latest/72x72/1f52e.png

theme: dark
color: slate
cardBlur: md

# Section order + columns. (Heavy theme work lives in custom.css.)
layout:
  Sabrina's Console:
    style: row
    columns: 3
    icon: mdi-star-four-points
  The Coven:
    style: row
    columns: 4
    icon: mdi-cat
  The Households:
    style: row
    columns: 3
    icon: mdi-home-group
  The Other Realm:
    style: row
    columns: 4
    icon: mdi-eye-outline

headerStyle: clean
hideVersion: true
useEqualHeights: true

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: true
  hideVisitURL: true
