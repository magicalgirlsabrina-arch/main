<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF1493"/>
      <stop offset="35%"  stop-color="#FF6EC7"/>
      <stop offset="65%"  stop-color="#9B7EDE"/>
      <stop offset="100%" stop-color="#1A1B4B"/>
    </linearGradient>
    <linearGradient id="moon-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFE4A3"/>
      <stop offset="100%" stop-color="#E8C547"/>
    </linearGradient>
    <linearGradient id="sparkle-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFD66B"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD66B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Sprinkled stars -->
  <circle cx="80"  cy="80"  r="3"   fill="#F4EAFB" opacity="0.9"/>
  <circle cx="430" cy="100" r="2.5" fill="#FFD66B" opacity="0.85"/>
  <circle cx="60"  cy="430" r="2"   fill="#FFB6D5" opacity="0.8"/>
  <circle cx="450" cy="420" r="3"   fill="#A8E0FF" opacity="0.85"/>
  <circle cx="120" cy="200" r="2"   fill="#F4EAFB" opacity="0.85"/>
  <circle cx="400" cy="320" r="2.5" fill="#FFD66B" opacity="0.85"/>

  <!-- Glow halo -->
  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>

  <!-- Moon and sparkle composition: crescent on left, sparkle on right -->
  <!-- Crescent (waxing) -->
  <path d="M225 130
           A 110 110 0 1 1 225 350
           A 88 88 0 1 0 225 130 Z"
        fill="url(#moon-fill)"
        filter="drop-shadow(0 0 16px rgba(255,214,107,0.55))"/>

  <!-- Large sparkle to the right of the moon -->
  <path d="M340 200
           C342 244 344 260 350 266
           C356 272 372 274 416 272
           C372 270 356 268 350 262
           C344 256 342 240 340 200 Z
           M340 320
           C338 276 336 260 330 254
           C324 248 308 246 264 248
           C308 250 324 252 330 258
           C336 264 338 280 340 320 Z"
        fill="url(#sparkle-fill)"
        filter="drop-shadow(0 0 12px rgba(255,255,255,0.6))"/>
  <path d="M340 200 C344 248 346 264 350 268 C354 272 370 274 416 272
           C370 270 354 268 350 264 C346 260 344 244 340 200 Z" fill="url(#sparkle-fill)"/>

  <!-- Tiny twinkle accents -->
  <path d="M380 410 L382 420 L392 422 L382 424 L380 434 L378 424 L368 422 L378 420 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M150 410 L151 418 L159 419 L151 421 L150 429 L149 421 L141 419 L149 418 Z" fill="#FFD66B" opacity="0.85"/>
</svg>
