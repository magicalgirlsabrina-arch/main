<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" preserveAspectRatio="xMidYMid meet">
  <!--
    "Sabrina" wordmark using Allura — the closest free copperplate
    script to the actual show logo (Bickley Script, 1986, proprietary).
    Renders the word as SVG text so the kerning, baseline, and curves
    are real script type — not hand-drawn approximations. Filled with
    the iridescent gradient (SMIL animated). 5-point star above the
    "i" is signature show element.

    Allura is loaded via @import inside the SVG so the asset is
    self-contained — no external font dependency in the host page.
  -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Allura&amp;display=swap');
    .sabrina-text {
      font-family: 'Allura', 'Brush Script MT', cursive;
      font-size: 230px;
      font-weight: 400;
    }
  </style>

  <defs>
    <linearGradient id="sabrina-shimmer" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FF1493">
        <animate attributeName="stop-color"
                 values="#FF1493;#FF80C8;#B19CD9;#5BE0FF;#FFD700;#FF1493"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#B19CD9">
        <animate attributeName="stop-color"
                 values="#B19CD9;#5BE0FF;#FFD700;#FF1493;#FF80C8;#B19CD9"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFD700">
        <animate attributeName="stop-color"
                 values="#FFD700;#FF1493;#FF80C8;#B19CD9;#5BE0FF;#FFD700"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="sabrina-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The wordmark — Allura, centered, with iridescent gradient fill +
       a thin dark outline (mimics the show logo's stroke effect). -->
  <text x="380" y="165"
        text-anchor="middle"
        class="sabrina-text"
        fill="url(#sabrina-shimmer)"
        stroke="rgba(15, 5, 36, 0.45)"
        stroke-width="1.5"
        paint-order="stroke fill"
        filter="url(#sabrina-glow)">Sabrina</text>

  <!-- 5-point star floating above the "i" (signature show element).
       Allura's "i" lands roughly at x=445 of a centered "Sabrina" at
       x=380, font-size 230. Star is sized + positioned to read as the
       dot. Slow rotation + SMIL keeps it twinkling. -->
  <path d="M 445 28
           L 451 50
           L 474 50
           L 455 64
           L 462 86
           L 445 72
           L 428 86
           L 435 64
           L 416 50
           L 439 50 Z"
        fill="url(#sabrina-shimmer)"
        filter="url(#sabrina-glow)">
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0 445 56"
                      to="360 445 56"
                      dur="14s"
                      repeatCount="indefinite"/>
  </path>

  <!-- Small accent sparkles flanking the wordmark -->
  <path d="M 60 60
           L 64 78
           L 82 78
           L 67 89
           L 73 107
           L 60 95
           L 47 107
           L 53 89
           L 38 78
           L 56 78 Z"
        fill="url(#sabrina-shimmer)"
        opacity="0.85"
        filter="url(#sabrina-glow)"/>

  <path d="M 700 130
           L 703 144
           L 717 146
           L 703 148
           L 700 162
           L 697 148
           L 683 146
           L 697 144 Z"
        fill="url(#sabrina-shimmer)"
        opacity="0.75"
        filter="url(#sabrina-glow)"/>
</svg>
