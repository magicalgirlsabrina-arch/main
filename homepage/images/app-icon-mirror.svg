<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1A1B4B"/>
      <stop offset="50%"  stop-color="#3D1B6E"/>
      <stop offset="100%" stop-color="#5E2A84"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD66B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFE4A3"/>
      <stop offset="100%" stop-color="#E8C547"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Layered nebula wash -->
  <ellipse cx="380" cy="120" rx="180" ry="100" fill="#FF1493" opacity="0.18"/>
  <ellipse cx="100" cy="380" rx="160" ry="120" fill="#9B7EDE" opacity="0.20"/>

  <!-- Starfield -->
  <circle cx="60"  cy="80"  r="3"   fill="#F4EAFB"/>
  <circle cx="120" cy="180" r="2"   fill="#FFD66B"/>
  <circle cx="80"  cy="290" r="2.5" fill="#FFB6D5"/>
  <circle cx="160" cy="70"  r="2"   fill="#F4EAFB"/>
  <circle cx="40"  cy="200" r="1.8" fill="#A8E0FF"/>
  <circle cx="180" cy="320" r="2.5" fill="#FFD66B"/>
  <circle cx="50"  cy="430" r="2"   fill="#F4EAFB"/>
  <circle cx="450" cy="60"  r="3"   fill="#FFD66B"/>
  <circle cx="430" cy="340" r="2"   fill="#FFB6D5"/>
  <circle cx="380" cy="450" r="2.5" fill="#F4EAFB"/>

  <!-- Twinkles around the moon -->
  <path d="M150 240 L152 252 L164 254 L152 256 L150 268 L148 256 L136 254 L148 252 Z" fill="#F4EAFB" opacity="0.85"/>
  <path d="M420 200 L422 212 L434 214 L422 216 L420 228 L418 216 L406 214 L418 212 Z" fill="#FFD66B" opacity="0.85"/>

  <!-- Glow halo -->
  <circle cx="290" cy="256" r="200" fill="url(#moon-glow)"/>

  <!-- Crescent moon (waxing) -->
  <path d="M340 96
           A 160 160 0 1 1 340 416
           A 130 130 0 1 0 340 96 Z"
        fill="url(#moon-fill)"
        filter="drop-shadow(0 0 24px rgba(255,214,107,0.55))"/>
</svg>
