        fill="currentColor" opacity="0.7"/>
  <path d="M20 22
           Q 30 26 32 34
           Q 28 39 22 33
           Q 20 28 20 25 Z"
        fill="currentColor" opacity="0.7"/>
  <!-- antennae -->
