name: spellman-manor

services:
  # 🔮 The Discovery of Magic — front-door dashboard
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: discovery-of-magic
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      HILDA_HOST:  ${HILDA_HOST}
      ZELDA_HOST:  ${ZELDA_HOST}
      SALEM_HOST:  ${SALEM_HOST}
      HARVEY_HOST: ${HARVEY_HOST}
      HILDA_TOKEN:  ${HILDA_TOKEN}
      ZELDA_TOKEN:  ${ZELDA_TOKEN}
      SALEM_TOKEN:  ${SALEM_TOKEN}
      HARVEY_TOKEN: ${HARVEY_TOKEN}

  # 💗 Vital Signs of the Coven — lightweight per-host monitoring
  beszel:
    image: henrygd/beszel:latest
    container_name: vital-signs
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./beszel-data:/beszel_data

  # 👁 The eye that watches — scrapes OpenClaw + Jetson metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: the-watcher
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/tokens:/etc/prometheus/tokens:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'

  # 🌙 The scrying glass — Other Realm Surveillance + The Cast Log
  grafana:
    image: grafana/grafana:latest
    container_name: scrying-glass
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/other-realm-surveillance.json
      # Witchy dark theme
      GF_USERS_DEFAULT_THEME: dark

volumes:
  prometheus-data:
  grafana-data:
