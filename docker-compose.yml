name: spellman-manor

services:
  # 🔮 The Discovery of Magic — front door
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: discovery-of-magic
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      # Homepage substitutes ${HOMEPAGE_VAR_*} into services.yaml at render time.
      # The HOMEPAGE_VAR_ prefix is required — without it Homepage doesn't
      # expose the variable to the YAML templating engine, and tile hrefs
      # show the literal placeholder string instead of the IP/port.
      HOMEPAGE_VAR_SPELLMAN_MANOR_IP:    ${SPELLMAN_MANOR_IP}
      HOMEPAGE_VAR_HARVEYS_BIG_GAME_IP:  ${HARVEYS_BIG_GAME_IP}
      HOMEPAGE_VAR_ZELDAS_LABTOP_IP:     ${ZELDAS_LABTOP_IP}
      HOMEPAGE_VAR_SALEM_GATEWAY_PORT:   ${SALEM_GATEWAY_PORT}
      HOMEPAGE_VAR_HILDA_GATEWAY_PORT:   ${HILDA_GATEWAY_PORT}
      HOMEPAGE_VAR_ZELDA_GATEWAY_PORT:   ${ZELDA_GATEWAY_PORT}
      HOMEPAGE_VAR_HARVEY_GATEWAY_PORT:  ${HARVEY_GATEWAY_PORT}
      HOMEPAGE_VAR_SALEM_GATEWAY_TOKEN:  ${SALEM_GATEWAY_TOKEN}
      HOMEPAGE_VAR_HILDA_GATEWAY_TOKEN:  ${HILDA_GATEWAY_TOKEN}
      HOMEPAGE_VAR_ZELDA_GATEWAY_TOKEN:  ${ZELDA_GATEWAY_TOKEN}
      HOMEPAGE_VAR_HARVEY_GATEWAY_TOKEN: ${HARVEY_GATEWAY_TOKEN}

  # 💌 Coven Mail Bridge — exposes Salem's inbox + a send proxy
  coven-mail:
    build: ./coven-mail-bridge
    container_name: coven-mail
    restart: unless-stopped
    ports: ["18793:18793"]
    volumes:
      - ${COVEN_MAILBOX_DIR}:/mailbox:rw
      - ./docs/13-familiar-handbook.md:/app/handbook.md:ro
    extra_hosts:
      # `host.docker.internal` already resolves on Docker Desktop, but
      # we add it here explicitly in case Compose v2 strips the magic
      # mapping. This is what Salem and Hilda use as their host (they
      # live on the SAME Mac as the bridge, so we route via the Mac's
      # loopback rather than out through the tailnet — that's what was
      # producing 'Errno 101 Network is unreachable'). Zelda and Harvey
      # use real tailnet IPs since they're on different Macs.
      - "host.docker.internal:host-gateway"
    environment:
      MAILBOX_DIR: /mailbox
      SALEM_HOST:  host.docker.internal
      HILDA_HOST:  host.docker.internal
      ZELDA_HOST:  ${ZELDAS_LABTOP_IP}
      HARVEY_HOST: ${HARVEYS_BIG_GAME_IP}
      SALEM_GATEWAY_PORT:  ${SALEM_GATEWAY_PORT}
      HILDA_GATEWAY_PORT:  ${HILDA_GATEWAY_PORT}
      ZELDA_GATEWAY_PORT:  ${ZELDA_GATEWAY_PORT}
      HARVEY_GATEWAY_PORT: ${HARVEY_GATEWAY_PORT}
      SALEM_HOOK_TOKEN:  ${SALEM_HOOK_TOKEN}
      HILDA_HOOK_TOKEN:  ${HILDA_HOOK_TOKEN}
      ZELDA_HOOK_TOKEN:  ${ZELDA_HOOK_TOKEN}
      HARVEY_HOOK_TOKEN: ${HARVEY_HOOK_TOKEN}
      SALEM_GATEWAY_TOKEN:  ${SALEM_GATEWAY_TOKEN}
      HILDA_GATEWAY_TOKEN:  ${HILDA_GATEWAY_TOKEN}
      ZELDA_GATEWAY_TOKEN:  ${ZELDA_GATEWAY_TOKEN}
      HARVEY_GATEWAY_TOKEN: ${HARVEY_GATEWAY_TOKEN}
      MAILBOX_PORT:  ${MAILBOX_PORT}
      MAILBOX_TOKEN: ${MAILBOX_TOKEN}

  # 🪞 The Magic Mirror — kiosk view for the Android TV
  magic-mirror:
    image: nginx:alpine
    container_name: magic-mirror
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./magic-mirror:/usr/share/nginx/html:ro

  # 🪟 The Veil — wraps Homepage with custom PWA manifest + iOS meta tags.
  # Open :3030 instead of :3000 to install Spellman Manor as an iOS web app
  # with the gold-sparkle-on-pink-violet icon. (See docs/14-remote-access.md)
  homepage-pwa:
    image: nginx:alpine
    container_name: the-veil
    restart: unless-stopped
    ports: ["3030:80"]
    depends_on: [homepage]
    volumes:
      - ./homepage-pwa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./homepage-pwa:/pwa:ro

  # 💗 Vital Signs of the Coven — lightweight host monitoring
  beszel:
    image: henrygd/beszel:latest
    container_name: vital-signs
    restart: unless-stopped
    ports: ["8090:8090"]
    volumes:
      - ./beszel-data:/beszel_data

  # 👁 The Watcher — scrapes OpenClaw familiars over Tailscale
  prometheus:
    image: prom/prometheus:latest
    container_name: the-watcher
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/tokens:/etc/prometheus/tokens:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  # 🔔 Howling Hat Delivery — alert routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: howling-hat
    restart: unless-stopped
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  # 🌙 The Scrying Glass — Cast Log + Coven Atlas
  grafana:
    image: grafana/grafana:latest
    container_name: scrying-glass
    restart: unless-stopped
    ports: ["3001:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/the-coven-atlas.json

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
