global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    coven: spellman

scrape_configs:
  # ── OpenClaw gateway metrics (one job per ClawBot for per-host bearer auth)
  - job_name: openclaw-hilda
    metrics_path: /api/diagnostics/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tokens/hilda.token
    static_configs:
      - targets: ['hilda.tailXXXX.ts.net:18789']
        labels: { clawbot: hilda, role: aunt-chaos }

  - job_name: openclaw-zelda
    metrics_path: /api/diagnostics/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tokens/zelda.token
    static_configs:
      - targets: ['zelda.tailXXXX.ts.net:18789']
        labels: { clawbot: zelda, role: aunt-scholar }

  - job_name: openclaw-salem
    metrics_path: /api/diagnostics/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tokens/salem.token
    static_configs:
      - targets: ['salem.tailXXXX.ts.net:18789']
        labels: { clawbot: salem, role: cat }

  - job_name: openclaw-harvey
    metrics_path: /api/diagnostics/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tokens/harvey.token
    static_configs:
      - targets: ['harvey.tailXXXX.ts.net:18789']
        labels: { clawbot: harvey, role: mortal }

  # ── Jetson hardware (GPU, temps, power) via jetson-stats exporter on :9100
  - job_name: other-realm-hardware
    static_configs:
      - targets: ['hilda.tailXXXX.ts.net:9100']
        labels: { clawbot: hilda }
      - targets: ['zelda.tailXXXX.ts.net:9100']
        labels: { clawbot: zelda }
      - targets: ['salem.tailXXXX.ts.net:9100']
        labels: { clawbot: salem }
      - targets: ['harvey.tailXXXX.ts.net:9100']
        labels: { clawbot: harvey }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
