global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    coven: spellman

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['howling-hat:9093']

scrape_configs:
  # ── Familiars: each OpenClaw gateway exposes /api/diagnostics/prometheus ──
  # Per-job auth so each familiar can have its own operator-scope token.

  - job_name: salem
    metrics_path: /api/diagnostics/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tokens/salem.token
    static_configs:
      - targets: ['100.106.134.96:18789']
        labels: { familiar: salem, host: spellman-manor, role: cat }

  - job_name: hilda
    metrics_path: /api/diagnostics/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tokens/hilda.token
    static_configs:
      - targets: ['100.106.134.96:18790']
        labels: { familiar: hilda, host: spellman-manor, role: aunt-chaos }

  - job_name: zelda
    metrics_path: /api/diagnostics/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tokens/zelda.token
    static_configs:
      - targets: ['100.112.73.96:18789']
        labels: { familiar: zelda, host: zeldas-labtop, role: aunt-scholar }

  - job_name: harvey
    metrics_path: /api/diagnostics/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/tokens/harvey.token
    static_configs:
      - targets: ['100.79.115.101:18789']
        labels: { familiar: harvey, host: harveys-workshop, role: mortal }

  # ── Coven Mail Bridge: exposes mail-flow metrics ──────────────────────────
  - job_name: coven-mail
    metrics_path: /metrics
    static_configs:
      - targets: ['coven-mail:18793']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['howling-hat:9093']
