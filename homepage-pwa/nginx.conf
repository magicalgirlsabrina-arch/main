# 🪟 The Veil — wraps Homepage with custom PWA manifest, icon, and
# iOS meta tags Homepage doesn't expose via settings.yaml.
#
# Listens on :80 inside the container (mapped to :3030 outside).
# Proxies everything to homepage:3000, with two interventions:
#   1) Override the served files for manifest / icons / favicon
#   2) Rewrite the HTML on the fly to neutralize Homepage's defaults
#      and inject our PWA tags — no duplicates, no Homepage source edit

server {
    listen 80;
    server_name _;

    # ── 1. Override served PWA files ─────────────────────────────────
    # These take priority over anything Homepage serves at the same path.

    location = /apple-touch-icon.png {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /apple-touch-icon-precomposed.png {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /apple-touch-icon.svg {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /favicon.ico {
        alias /pwa/favicon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /favicon.svg {
        alias /pwa/favicon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /icon-180.svg {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /icon-512.svg {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /manifest.json {
        alias /pwa/manifest.json;
        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /manifest.webmanifest {
        alias /pwa/manifest.json;
        add_header Content-Type "application/manifest+json" always;
    }

    # ── 2. Reverse-proxy everything else, rewriting <head> ───────────
    location / {
        proxy_pass http://discovery-of-magic:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # sub_filter needs an unencoded body to scan / rewrite. Force it.
        proxy_set_header Accept-Encoding "";

        # Apply rewrites to HTML responses only.
        sub_filter_types text/html;

        # ALL occurrences (so multiple homepage-emitted tags are cleared).
        # Rewrites below don't re-match after replacement, so no infinite loop.
        sub_filter_once off;

        # ── Strip Homepage's defaults so we don't end up with duplicates.
        # Each directive renames the tag's `rel`/`name` attribute; browsers
        # then ignore the renamed tag entirely. The original `href`/`content`
        # values are preserved as inert HTML, easy to inspect via view-source.
        sub_filter '<link rel="manifest"'                  '<link data-veil-stripped rel="manifest-stripped"';
        sub_filter '<link rel="apple-touch-icon"'          '<link data-veil-stripped rel="apple-touch-icon-stripped"';
        sub_filter '<link rel="apple-touch-icon-precomposed"' '<link data-veil-stripped rel="apple-touch-icon-precomposed-stripped"';
        sub_filter '<link rel="icon"'                      '<link data-veil-stripped rel="icon-stripped"';
        sub_filter '<link rel="shortcut icon"'             '<link data-veil-stripped rel="shortcut-icon-stripped"';
        sub_filter '<meta name="theme-color"'              '<meta data-veil-stripped name="theme-color-stripped"';
        sub_filter '<meta name="apple-mobile-web-app-capable"'           '<meta data-veil-stripped name="apple-mobile-web-app-capable-stripped"';
        sub_filter '<meta name="apple-mobile-web-app-title"'             '<meta data-veil-stripped name="apple-mobile-web-app-title-stripped"';
        sub_filter '<meta name="apple-mobile-web-app-status-bar-style"'  '<meta data-veil-stripped name="apple-mobile-web-app-status-bar-style-stripped"';
        sub_filter '<meta name="mobile-web-app-capable"'                 '<meta data-veil-stripped name="mobile-web-app-capable-stripped"';

        # ── Inject our PWA tags before </head>. nginx advances the scan
        # past the replacement, so this fires exactly once per </head>
        # in the response — no risk of re-injection or duplication.
        sub_filter '</head>' '<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spellman Manor"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#FF3FA4"><meta name="mobile-web-app-capable" content="yes"></head>';
    }
}
