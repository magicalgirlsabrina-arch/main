# 🪟 Homepage PWA Veil — wraps the upstream Homepage container with
# a custom manifest, themed apple-touch-icon, and the iOS meta tags
# Homepage doesn't expose via its own settings.yaml.
#
# Listens on port 80 inside the container (mapped to :3030 outside).
# Proxies everything to homepage:3000, but intercepts:
#   /manifest.json        — our custom manifest (Sabrina theme)
#   /apple-touch-icon*    — gold sparkle on pink/violet gradient
#   /icon-180.svg, /icon-512.svg, /favicon.svg
#
# And injects PWA meta tags into the <head> of every HTML response.

server {
    listen 80;
    server_name _;

    # ── Override served files (alphabetical) ─────────────────────────
    location = /apple-touch-icon.png {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /apple-touch-icon-precomposed.png {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /apple-touch-icon.svg {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /favicon.ico {
        alias /pwa/favicon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /favicon.svg {
        alias /pwa/favicon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /icon-180.svg {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /icon-512.svg {
        alias /pwa/apple-touch-icon.svg;
        add_header Content-Type "image/svg+xml" always;
    }
    location = /manifest.json {
        alias /pwa/manifest.json;
        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "public, max-age=300" always;
    }
    location = /manifest.webmanifest {
        alias /pwa/manifest.json;
        add_header Content-Type "application/manifest+json" always;
    }

    # ── Reverse proxy everything else to Homepage ────────────────────
    location / {
        proxy_pass http://discovery-of-magic:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Inject PWA meta tags into Homepage's <head>.
        # sub_filter rewrites the HTML on the fly — no Homepage edit needed.
        proxy_set_header Accept-Encoding "";   # disable gzip so sub_filter sees the body
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spellman Manor"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#FF3FA4"><meta name="mobile-web-app-capable" content="yes"></head>';
    }
}
